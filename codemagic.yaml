workflows:
  android-debug:
    name: ReyKizen Debug Build
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Build debug APK
        script: |
          cd reykizen
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - reykizen/app/build/outputs/apk/debug/*.apk
